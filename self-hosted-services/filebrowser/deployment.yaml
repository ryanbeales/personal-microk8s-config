apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app.kubernetes.io/name: filebrowser
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: filebrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebrowser
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: filebrowser
          # renovate: datasource=docker depname=gtstef/filebrowser versioning=semver
          image: gtstef/filebrowser:1.5.6-stable-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: FILEBROWSER_CONFIG
              value: /etc/filebrowser/config.yaml
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: filebrowser-config
              mountPath: /etc/filebrowser
            - name: filebrowser-storage
              mountPath: /home/filebrowser/data
              subPath: data
            - name: filebrowser-storage
              mountPath: /srv
              subPath: srv
      volumes:
        - name: filebrowser-config
          configMap:
            name: filebrowser-config
        - name: filebrowser-storage
          persistentVolumeClaim:
            claimName: filebrowser-nfs-pvc
